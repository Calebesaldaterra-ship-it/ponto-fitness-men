<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel — Ponto Fitness for Men</title>
<link rel="icon" href="../imagens/mascote.webp">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#101310;--card:#191c19;--line:#2a2f29;--cream:#f2f1ea;--muted:#9aa094;--lime:#d6f24a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(900px 500px at 50% -10%,#1d2a17,transparent),var(--bg);
  color:var(--cream);font:15px/1.5 'DM Sans',system-ui,sans-serif;padding:24px}
.box{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:34px 30px;box-shadow:0 24px 60px #0009}
.marca{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.marca img{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#222}
.marca b{font:800 15px Manrope;letter-spacing:-.02em;display:block}
.marca span{color:var(--muted);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
h1{font:800 26px Manrope;letter-spacing:-.04em;margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 24px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 16px}
input{width:100%;margin-top:6px;background:#12150f;border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;color:var(--cream);font:inherit;outline:none}
input:focus{border-color:var(--lime)}
button{width:100%;margin-top:6px;border:0;border-radius:999px;background:var(--lime);color:#15180f;
  font:700 14px 'DM Sans';padding:14px;cursor:pointer}
button:active{transform:translateY(1px)}
.erro{background:#3a1d1d;border:1px solid #7a3b3b;color:#ffb4b4;border-radius:10px;
  padding:10px 12px;font-size:12.5px;margin-bottom:16px;display:none}
.pe{margin:22px 0 0;text-align:center}
.pe a{color:var(--muted);font-size:12px;text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="marca">
    <img src="../imagens/mascote.webp" alt="">
    <div><b>Ponto Fitness for Men</b><span>Painel da loja</span></div>
  </div>
  <h1>Entrar</h1>
  <p class="sub">Acesso para editar produtos, descrições e preços.</p>
  <div class="erro" id="erro">Usuário ou senha incorretos.</div>
  <label>E-mail<input id="u" type="email" autocapitalize="off" autocorrect="off" required></label>
  <label>Senha<input id="p" type="password" required></label>
  <button type="submit">Entrar no painel</button>
  <p class="pe"><a href="../">Voltar para a loja</a></p>
</form>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA4r-A_7Ok3ulLSkjxjE8G78qbEQM4z09o",
  authDomain: "ponto-fitness.firebaseapp.com",
  projectId: "ponto-fitness",
  storageBucket: "ponto-fitness.firebasestorage.app",
  messagingSenderId: "650702339619",
  appId: "1:650702339619:web:90d005e88bc79e208f3b96",
  measurementId: "G-B63XQX0H1E"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const u = document.getElementById("u").value.trim().toLowerCase();
  const p = document.getElementById("p").value;
  const erro = document.getElementById("erro");
  try {
    await auth.signInWithEmailAndPassword(u, p);
    try { sessionStorage.setItem("pf_admin", "1"); } catch(err){}
    location.href = "../#admin";
  } catch(err) {
    erro.textContent = "E-mail ou senha incorretos.";
    erro.style.display = "block";
    document.getElementById("p").value = "";
    document.getElementById("p").focus();
  }
});
</script>
</body>
</html>
